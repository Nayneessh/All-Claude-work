name: Android verify (emulator)

on:
  workflow_dispatch:
    inputs:
      apk_branch:
        description: 'Branch holding the APK(s): release (signed, final) or ci-artifacts (unsigned CI build)'
        default: release

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.apk_branch }}', path: apks }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: APK metadata, signature, signer fingerprint, alignment
        run: bash scripts/android/inspect-apk.sh apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator (Android 14, Pixel 6) — install, launch, drive, kill, relaunch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android/emulator-verify.sh apks
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: emulator-evidence, path: out/, retention-days: 30 }
