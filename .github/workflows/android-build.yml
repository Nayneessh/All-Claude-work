name: Android build

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK (preinstalled on the runner) — accept licences, ensure platform/build-tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Assemble release + debug APKs
        working-directory: android
        env:
          MG_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 && '/tmp/mg.keystore' || '' }}
          MG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > /tmp/mg.keystore; fi
          VN=$(node -p "require('../package.json').version")
          ./gradlew --no-daemon assembleRelease assembleDebug -PmgVersionName="$VN" -PmgVersionCode="${{ github.run_number }}"
      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/ || true
          cp android/app/build/outputs/apk/debug/*.apk out/ || true
          ls -la out
          $ANDROID_HOME/build-tools/*/aapt2 dump badging out/app-release*.apk | head -8 || true
      - uses: actions/upload-artifact@v4
        with:
          name: monster-gains-apks
          path: out/*.apk
          retention-days: 30
      - name: Publish build output to the ci-artifacts branch (clean, single-commit)
        if: github.ref_name != 'ci-artifacts'
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PUB="$RUNNER_TEMP/pub"
          mkdir -p "$PUB"
          cp out/*.apk "$PUB/"
          echo "${{ github.sha }}" > "$PUB/SOURCE_SHA"
          cd "$PUB"
          git init -q -b ci-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI build of ${{ github.sha }} (run ${{ github.run_number }})"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${{ github.repository }}.git" ci-artifacts
